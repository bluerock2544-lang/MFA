<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>แชทกับน้องสุขใจ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap">
<style>
/* Layout: one chat column. น้องสุขใจ sends messages and rich cards, you reply with quick-reply chips, and the quiz is answered inside the conversation. */
:root {
  --bg: #FBEFF2;
  --surface: #FFFFFF;
  --ink: #3A2430;
  --muted: #7A5E69;
  --line: #EBD3DA;
  --accent: #C93C63;
  --accent-ink: #FFFFFF;
  --accent-soft: #FADCE5;
  --user: #8A4F2D;
  --blue: #2F9BD3;
  --bad: #B93815;
  --bad-soft: #FBE4DC;
  --ok: #17803D;
  --ok-soft: #DDF3E4;
  --m-line: #E2C9D1;
  --font-body: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
  --font-display: "Kanit", "Sarabun", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1519; --surface: #2B1F25; --ink: #F6E9ED; --muted: #C2A9B2; --line: #4A3640;
    --accent: #FF8FAE; --accent-ink: #2B0E17; --accent-soft: #4A2330; --user: #A8663D; --blue: #5CB8E8;
    --bad: #FF8A66; --bad-soft: #3A1E15; --ok: #5ED68A; --ok-soft: #133421; --m-line: #6C5460;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1519; --surface: #2B1F25; --ink: #F6E9ED; --muted: #C2A9B2; --line: #4A3640;
  --accent: #FF8FAE; --accent-ink: #2B0E17; --accent-soft: #4A2330; --user: #A8663D; --blue: #5CB8E8;
  --bad: #FF8A66; --bad-soft: #3A1E15; --ok: #5ED68A; --ok-soft: #133421; --m-line: #6C5460;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 10; }
.app { max-width: 600px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background-color: var(--bg); background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 20px 20px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
p { margin: 0; }

/* Mascot */
.m { width: 100%; height: auto; display: block; overflow: visible; }
.m .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.m.wave .arm-r { transform-origin: 148px 168px; animation: wave 1s ease-in-out infinite alternate; }
@keyframes wave { from { transform: rotate(-85deg); } to { transform: rotate(-112deg); } }
.m.mood-cheer .arm-l { transform-origin: 52px 168px; transform: rotate(80deg); }
.m.mood-cheer .arm-r { transform-origin: 148px 168px; transform: rotate(-80deg); }

/* Limbs: arms sway, feet step, body bobs (cheer = jump + flap) */
.m .bob { animation: bob .8s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.m .foot-l, .m .foot-r { transform-box: fill-box; transform-origin: center; animation: step 1.6s ease-in-out infinite; }
.m .foot-r { animation-delay: -.8s; }
@keyframes step { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-3px, -5px); } 50% { transform: translate(0, 0); } 75% { transform: translate(3px, 0); } }
.m .arm-l { transform-origin: 52px 168px; animation: swing-l .8s ease-in-out infinite alternate; }
.m .arm-r { transform-origin: 148px 168px; animation: swing-r .8s ease-in-out infinite alternate; }
@keyframes swing-l { from { transform: rotate(-10deg); } to { transform: rotate(16deg); } }
@keyframes swing-r { from { transform: rotate(10deg); } to { transform: rotate(-16deg); } }
.m.mood-cheer .bob { animation: jump .5s ease-in-out infinite; }
@keyframes jump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
.m.mood-cheer .foot-l, .m.mood-cheer .foot-r { animation-duration: .5s; }
.m.mood-cheer .foot-r { animation-delay: -.25s; }
.m.mood-cheer .arm-l { animation: cheer-l .25s ease-in-out infinite alternate; }
.m.mood-cheer .arm-r { animation: cheer-r .25s ease-in-out infinite alternate; }
@keyframes cheer-l { from { transform: rotate(62deg); } to { transform: rotate(98deg); } }
@keyframes cheer-r { from { transform: rotate(-62deg); } to { transform: rotate(-98deg); } }

/* Profile avatars (header + beside bubbles) stay still */
.av .m .bob, .av .m .foot-l, .av .m .foot-r, .av .m .arm-l, .av .m .arm-r { animation: none; }
.sub { font-size: .8rem; font-weight: 600; color: var(--accent); margin: 10px 0 6px; }
.sub:first-of-type { margin-top: 0; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .av { width: 44px; height: 44px; }
.top b { font-family: var(--font-display); font-weight: 500; display: block; line-height: 1.2; }
.top small { color: var(--ok); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.top small::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.av { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); overflow: hidden; border: 1px solid var(--line); position: relative; }
.av svg { position: absolute; width: 92%; left: 4%; top: -4%; }

/* Messages */
.chat { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px 12px 8px; }
.row { display: flex; gap: 8px; align-items: flex-end; animation: pop .3s ease both; }
.row.user { justify-content: flex-end; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 20px 20px 20px 6px; padding: 10px 14px; max-width: 86%; min-width: 0; box-shadow: 0 1px 0 var(--line); }
.row.user .bubble { background: var(--user); border-color: var(--user); color: #fff; border-radius: 20px 20px 6px 20px; }
.row.bot .bubble.card { width: calc(100% - 44px); max-width: none; padding: 14px; }
.sticker { width: 132px; padding-left: 4px; }
.bubble b { font-family: var(--font-display); font-weight: 500; }
.hl-top { font-family: var(--font-display); font-weight: 600; font-size: 1.4em; letter-spacing: .05em; line-height: 1; vertical-align: -.05em; }
.hl { display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 1.15em; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); border: 1.5px solid var(--accent); border-radius: 10px; padding: 0 8px; line-height: 1.35; margin: 0 2px; }
.typing { display: flex; gap: 5px; padding: 14px 16px; }
.typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .5; animation: dotb 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dotb { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); opacity: 1; } }

/* Quick replies */
.qr { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 12px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, transparent, var(--bg) 28%); min-height: 24px; }
.qr.v { flex-direction: column; align-items: stretch; }
.chip { font: inherit; font-weight: 500; text-align: left; color: var(--accent); background: var(--surface); border: 1.5px solid var(--accent); border-radius: 999px; padding: 8px 16px; cursor: pointer; animation: pop .3s ease both; }
.chip:hover { background: var(--accent-soft); }
.qr.v .chip { border-radius: 16px; }

/* Demo card */
.cardtitle { font-family: var(--font-display); font-weight: 500; margin-bottom: 8px; }
.scale { position: relative; height: 20px; font-size: .74rem; color: var(--muted); font-weight: 500; }
.scale span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.lane { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.lane .who { font-size: .85rem; font-weight: 600; }
.lane-bad .who { color: var(--bad); } .lane-ok .who { color: var(--ok); }
.track { position: relative; height: 56px; }
.track::before { content: ""; position: absolute; left: 2%; right: 2%; top: 50%; height: 3px; border-radius: 2px; background: var(--line); transform: translateY(-50%); }
.gate { position: absolute; top: 50%; width: 8px; height: 46px; border-radius: 5px; background: var(--muted); transform: translate(-50%, -50%); }
.g1 { left: 38%; } .g2 { left: 66%; }
.goal { position: absolute; left: 94%; top: 50%; width: 28px; height: 28px; border-radius: 9px; border: 2px dashed var(--muted); transform: translate(-50%, -50%); }
.token { position: absolute; top: 50%; left: 4%; transform: translate(-50%, -50%); }
.t-ok { width: 34px; animation: ok-move 10s ease-in-out infinite; }
.t-bad { width: 32px; animation: bad-move 10s ease-in-out infinite; }
.t-bad svg { display: block; width: 100%; height: auto; }
.lane-bad .g1, .lane-ok .g1 { animation: gate1-open 10s infinite; }
.lane-bad .g2 { animation: gate2-block 10s infinite; }
.lane-ok .g2 { animation: gate2-open 10s infinite; }
.status { min-height: 22px; font-size: .82rem; font-weight: 600; text-align: right; opacity: 0; }
.lane-bad .status { color: var(--bad); animation: show-status 10s infinite; }
.lane-ok .status { color: var(--ok); animation: show-status 10s infinite; }
@keyframes bad-move {
  0% { left: 4%; opacity: 1; transform: translate(-50%, -50%); }
  22% { left: 38%; } 34% { left: 38%; }
  56% { left: 66%; transform: translate(-50%, -50%); }
  60% { transform: translate(calc(-50% - 6px), -50%); }
  63% { transform: translate(calc(-50% + 6px), -50%); }
  66% { transform: translate(calc(-50% - 6px), -50%); }
  69% { transform: translate(calc(-50% + 6px), -50%); }
  72% { left: 66%; transform: translate(-50%, -50%); }
  90% { left: 66%; opacity: 1; }
  96% { left: 58%; opacity: 0; }
  100% { left: 4%; opacity: 0; }
}
@keyframes ok-move {
  0% { left: 4%; opacity: 1; }
  22% { left: 38%; } 30% { left: 38%; }
  52% { left: 66%; } 66% { left: 66%; }
  82% { left: 94%; opacity: 1; }
  92% { left: 94%; opacity: 1; }
  97% { left: 94%; opacity: 0; }
  100% { left: 4%; opacity: 0; }
}
@keyframes gate1-open {
  0%, 30% { background: var(--muted); transform: translate(-50%, -50%) scaleY(1); }
  36%, 92% { background: var(--ok); transform: translate(-50%, -50%) scaleY(.3); }
  100% { background: var(--muted); transform: translate(-50%, -50%) scaleY(1); }
}
@keyframes gate2-block {
  0%, 55% { background: var(--muted); transform: translate(-50%, -50%) scaleY(1); }
  60%, 92% { background: var(--bad); transform: translate(-50%, -50%) scaleY(1.15); }
  100% { background: var(--muted); transform: translate(-50%, -50%) scaleY(1); }
}
@keyframes gate2-open {
  0%, 50% { background: var(--muted); transform: translate(-50%, -50%) scaleY(1); }
  58%, 92% { background: var(--ok); transform: translate(-50%, -50%) scaleY(.3); }
  100% { background: var(--muted); transform: translate(-50%, -50%) scaleY(1); }
}
@keyframes show-status {
  0%, 62% { opacity: 0; transform: translateY(4px); }
  68%, 92% { opacity: 1; transform: translateY(0); }
  97%, 100% { opacity: 0; }
}

/* Factor / steps / phone cards */
.frow { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.frow:first-of-type { border-top: 0; }
.fi { flex: none; width: 42px; height: 42px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.fi svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.frow h4 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 1rem; line-height: 1.3; }
.frow p { font-size: .9rem; color: var(--muted); }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: s; }
.tl li { counter-increment: s; display: flex; gap: 10px; align-items: center; opacity: 0; animation: pop .4s ease forwards; }
.tl li::before { content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; font-size: .85rem; }
.tl li:nth-child(1) { animation-delay: .2s; } .tl li:nth-child(2) { animation-delay: 1s; } .tl li:nth-child(3) { animation-delay: 1.8s; } .tl li:nth-child(4) { animation-delay: 2.6s; }
.qrbox { display: flex; justify-content: center; margin: 14px 0 2px; }
.qrwrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.qrbox img { width: 150px; height: 150px; background: #fff; padding: 8px; border-radius: 10px; image-rendering: pixelated; }
.qrcap { font-size: .8rem; font-weight: 600; color: var(--accent); }
.manualbtn { display: inline-block; margin-top: 4px; padding: 9px 22px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 500; font-size: .9rem; text-decoration: none; }
.manualbtn:hover { filter: brightness(1.08); }
.pm { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.big-num { color: var(--muted); font-size: .92rem; }
.big-num b { color: var(--accent); font-size: 1.6rem; font-family: var(--font-display); font-weight: 500; }
.phone { width: 160px; border: 3px solid var(--ink); border-radius: 22px; padding: 12px; background: var(--bg); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.phone .q { font-size: .74rem; line-height: 1.4; color: var(--muted); text-align: center; }
.phone .num { display: flex; gap: 6px; }
.phone .num span { width: 34px; height: 42px; border-radius: 9px; border: 2px solid var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 1.4rem; color: var(--accent); background: var(--surface); font-family: var(--font-display); }
.phone .ok { width: 100%; text-align: center; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: .8rem; font-weight: 600; padding: 4px 0; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); } 50% { box-shadow: 0 0 0 8px transparent; } }

/* Result */
.res { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.stars { display: flex; gap: 6px; }
.stars svg { width: 38px; height: 38px; fill: var(--line); }
.stars svg.on { fill: #F5B72E; animation: starpop .5s ease both; }
.stars svg.on:nth-child(2) { animation-delay: .2s; } .stars svg.on:nth-child(3) { animation-delay: .4s; }
@keyframes starpop { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
.res .score { font-family: var(--font-display); font-weight: 600; font-size: 2.2rem; color: var(--accent); line-height: 1.1; }
.tag-ok { color: var(--ok); font-weight: 600; } .tag-bad { color: var(--bad); font-weight: 600; }

/* Larger type, next button, in-chat quiz card */
html { font-size: 20px; }
.row { scroll-margin-top: 96px; }
.qr.next { justify-content: center; }
.nextbtn { font: inherit; font-weight: 600; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 999px; padding: 12px 40px; min-width: 60%; cursor: pointer; box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 65%, #000); animation: pop .3s ease both; }
.nextbtn:hover { filter: brightness(1.06); }
.nextbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 65%, #000); }
.qhead { font-size: .8rem; font-weight: 600; color: var(--accent); }
.qtext { font-family: var(--font-display); font-weight: 500; line-height: 1.4; margin: 2px 0 4px; }
.qhint { font-size: .8rem; color: var(--muted); margin-bottom: 12px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { font: inherit; text-align: left; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 14px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
.opt .k { flex: none; width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: .8rem; line-height: 1; margin-top: 2px; }
.opt:hover:not(:disabled) { background: var(--accent-soft); }
.opt:disabled { cursor: default; color: var(--ink); }
.opt.ok { background: var(--ok-soft); border-color: var(--ok); }
.opt.bad { background: var(--bad-soft); border-color: var(--bad); }
.opt.dim { opacity: .55; }

@media (prefers-reduced-motion: reduce) {
  .m .eye, .m .bob, .m .foot-l, .m .foot-r, .m .arm-l, .m .arm-r, .m.wave .arm-r, .row, .chip, .typing i, .phone .ok, .tl li, .stars svg.on, .token, .gate, .status { animation: none !important; }
  .tl li { opacity: 1; }
  .m.wave .arm-r { transform: rotate(-100deg); }
  .t-bad { left: 62%; } .t-ok { left: 94%; }
  .lane-bad .g1, .lane-ok .g1, .lane-ok .g2 { background: var(--ok); transform: translate(-50%, -50%) scaleY(.3); }
  .lane-bad .g2 { background: var(--bad); }
  .status { opacity: 1; }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

    <linearGradient id="mEar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A86840"/><stop offset="1" stop-color="#85492A"/></linearGradient>

<div class="app">
  <header class="top">
    <div class="av" id="topav" style="width:44px;height:44px"></div>
    <div><b>น้องสุขใจ</b><small><span>พร้อมคุยเรื่อง <span class="hl-top">MFA</span></span></small></div>
  </header>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="qr" id="qr"></div>
</div>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Mascot: white round body, brown bow ears, blue eyes, pink cheeks, open mouth with pink tongue */

    var M = {
      happy: '<path d="M89 121Q100 117 111 121L108 141Q100 147 92 141Z" fill="#3B2A2E"/><ellipse cx="100" cy="138" rx="6.500" ry="5" fill="#F2778F"/>',
      cheer: '<path d="M86 118Q100 112 114 118L110 145Q100 153 90 145Z" fill="#3B2A2E"/><ellipse cx="100" cy="142" rx="8" ry="6" fill="#F2778F"/>',
      smile: '<path d="M90 128Q100 139 110 128" fill="none" stroke="#3B2A2E" stroke-width="3.500" stroke-linecap="round"/>',
      worry: '<ellipse cx="100" cy="133" rx="5" ry="7.500" fill="#3B2A2E"/><path d="M64 97L84 103M136 97L116 103" stroke="#7A4528" stroke-width="3" stroke-linecap="round"/>'
    };
    var P = {
      phone: '<g transform="translate(10 32)"><g transform="rotate(-12 164 150)"><rect x="154" y="128" width="22" height="36" rx="5" fill="#2D3A4A"/><rect x="157" y="132" width="16" height="26" rx="3" fill="#7FD1F2"/></g></g>',
      shield: '<g transform="translate(100 199) scale(.7) translate(-100 -190)"><path d="M100 160L128 170V190C128 206 114 214 100 221C86 214 72 206 72 190V170Z" fill="#1F8FCB" stroke="#fff" stroke-width="3"/><path d="M88 190L97 199L114 180" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>'
    };
    var arm = 'fill="url(#mBody)" stroke="var(--m-line)" stroke-width="1.500"';
    function eye(x) {
      return '<g class="eye"><ellipse cx="' + x + '" cy="112" rx="6" ry="10" fill="#2F9BD3"/><ellipse cx="' + x + '" cy="115" rx="3.600" ry="6.500" fill="#8AD3EC"/></g>';

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function toEnd() { qr.scrollIntoView({ block: "end", behavior: reduce ? "auto" : "smooth" }); }

  async function say(html, opt) {

  }

  function ask(opts, vertical) {
    return new Promise(function (res) {
      qr.innerHTML = "";
      qr.className = "qr" + (vertical ? " v" : "");

        var b = document.createElement("button");
        b.type = "button"; b.className = "chip"; b.textContent = text;

          qr.innerHTML = "";
          var u = document.createElement("div");
          u.className = "row user";
          var bub = document.createElement("div");
          bub.className = "bubble"; bub.textContent = text;
          u.appendChild(bub); chat.appendChild(u); toEnd();

        qr.appendChild(b);
      });
      toEnd();
    });

  /* One big button replaces the old chat chips: the person only ever has to press "next" */
  function next(label) {
    return new Promise(function (res) {
      qr.innerHTML = ""; qr.className = "qr next";
      var btn = document.createElement("button");
      btn.type = "button"; btn.className = "nextbtn"; btn.textContent = label || "ถัดไป ›";
      btn.addEventListener("click", function () {
        qr.innerHTML = "";
        setTimeout(res, reduce ? 80 : 200);
      });
      qr.appendChild(btn); toEnd();
    });
  }

  /* The question and its choices live in one card inside the chat, so the choices never cover the question */
  async function quizCard(i) {
    var q = Q[i];
    qr.innerHTML = ""; qr.className = "qr";
    var row = document.createElement("div");
    row.className = "row bot";
    row.innerHTML = avatar() + '<div class="bubble typing"><i></i><i></i><i></i></div>';
    chat.appendChild(row); toEnd();
    await sleep(reduce ? 150 : 700);
    row.innerHTML = avatar() + '<div class="bubble card qcard"><div class="qhead">ข้อ ' + (i + 1) + " จาก " + Q.length + '</div><div class="qtext">' + q.q + '</div><div class="qhint">' + q.hint + '</div><div class="opts"></div></div>';
    var box = row.querySelector(".opts");
    return new Promise(function (res) {
      var L = ["ก", "ข", "ค", "ง"], btns = [];
      q.o.forEach(function (t, k) {
        var b = document.createElement("button");
        b.type = "button"; b.className = "opt";
        b.innerHTML = '<span class="k">' + L[k] + "</span><span></span>";
        b.lastChild.textContent = t;
        b.addEventListener("click", function () {
          btns.forEach(function (x, j) {
            x.disabled = true;
            if (j === k) x.classList.add(k === q.a ? "ok" : "bad");
            else if (j === q.a) x.classList.add("ok");
            else x.classList.add("dim");
          });
          setTimeout(function () { res(k); }, reduce ? 80 : 350);
        });
        btns.push(b); box.appendChild(b);
      });
      row.scrollIntoView({ block: "start", behavior: reduce ? "auto" : "smooth" });
    });
  }

  var runId = 0;
  async function run() {
    var me = ++runId;
    function alive() { return me === runId; }

    await say("สวัสดีจ้า น้องสุขใจเอง วันนี้เรามาคุยเรื่อง <span class=\"hl\">MFA</span> กัน", { instant: true });
    await say(mascot("happy", "", "wave"), { instant: true, sticker: true });
    await say("<span class=\"hl\">MFA</span> ย่อมาจาก <b>Multi-Factor Authentication</b> คือการยืนยันตัวตน 2 ขั้นตอน ต้องมีปัจจัยอย่างน้อย 2 ประเภท คือ รหัสผ่าน AD Account รวมกับการอนุมัติ MFA บนโทรศัพท์มือถือ");
    await say("ต่อให้มีใครรู้รหัสผ่าน AD Account ก็เข้าใช้งานไม่ได้ถ้าไม่มี MFA ยืนยันตัวตน");
    await say("พร้อมแล้วกดปุ่ม <b>ถัดไป</b> ด้านล่างได้เลย");
    await next();
    if (!alive()) return;

    await say("แล้ว MFA ช่วยอะไรบ้าง ลองดูตัวอย่างนะ สมมุติมีโจรขโมยรหัสผ่าน AD Account ของเราไปได้");
    await say(demoCard(), { card: true });
    await say("โจรเข้ารหัสผ่าน AD Account ได้ แต่ติด MFA บนโทรศัพท์มือถือ");
    await next();
    if (!alive()) return;

    await say("ก่อนใช้งานต้องติดตั้งก่อน แล้วค่อย Login ดูขั้นตอนคร่าวๆ ได้เลย");
    await say(stepsCard(), { card: true });
    await say(mascot("smile", "shield"), { sticker: true });
    await say("ถ้ามีคำขออนุมัติแจ้งเตือนมาทั้งที่ไม่ได้ Login เอง ให้ <b>กดปฏิเสธ</b> แล้วแจ้งฝ่าย IT ทันที");
    await next("เริ่มทำแบบทดสอบ ›");
    if (!alive()) return;

    await say("มาทดสอบความเข้าใจกันนะ มี 3 ข้อ อ่านโจทย์แล้วแตะเลือกคำตอบ 1 ข้อ");
    var score = 0;
    for (var i = 0; i < Q.length; i++) {
      var pick = await quizCard(i);
      if (!alive()) return;
      if (pick === Q[i].a) {
        score++;
        await say(mascot("cheer"), { sticker: true });
        await say('<span class="tag-ok">ถูกต้อง</span> ' + Q[i].e);
      } else {
        await say(mascot("worry"), { sticker: true });
        await say('<span class="tag-bad">ยังไม่ใช่นะ</span> ' + Q[i].e);
      }
      await next(i < Q.length - 1 ? "ข้อถัดไป ›" : "ดูคะแนน ›");
      if (!alive()) return;
    }
    await say(score >= 2 ? mascot("cheer") : mascot("smile"), { sticker: true });
    await say(resultCard(score), { card: true });
    await next("เริ่มใหม่อีกครั้ง ↻");
    chat.innerHTML = ""; qr.innerHTML = "";
    run();
  }
  run();
})();
</script>
